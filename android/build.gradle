import org.jetbrains.kotlin.gradle.dsl.JvmTarget

def pluginGradleProperties = new Properties()
def pluginGradlePropertiesFile = file('gradle.properties')
if (pluginGradlePropertiesFile.isFile()) {
    pluginGradlePropertiesFile.withInputStream { pluginGradleProperties.load(it) }
}

def includeGenaiAgentFlag = (
    project.findProperty('capacitorLLM.genaiAgent.include')
        ?: pluginGradleProperties.getProperty('capacitorLLM.genaiAgent.include')
        ?: 'false'
).toString()
def genaiAgentDependencyTypeFlag = (
    project.findProperty('capacitorLLM.genaiAgent.dependencyType')
        ?: pluginGradleProperties.getProperty('capacitorLLM.genaiAgent.dependencyType')
        ?: 'implementation'
).toString()

ext {
    junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.1'
    androidxJunitVersion = project.hasProperty('androidxJunitVersion') ? rootProject.ext.androidxJunitVersion : '1.3.0'
    androidxEspressoCoreVersion = project.hasProperty('androidxEspressoCoreVersion') ? rootProject.ext.androidxEspressoCoreVersion : '3.7.0'

    includeGenaiAgent = includeGenaiAgentFlag
    genaiAgentDependencyType = genaiAgentDependencyTypeFlag
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.0'
    }
}

if (includeGenaiAgentFlag == 'true') {
    apply plugin: 'org.jetbrains.kotlin.android'
}

apply plugin: 'com.android.library'

if (includeGenaiAgentFlag == 'true') {
    kotlin {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_21
        }
    }
}

android {
    namespace = "ee.forgr.capgo_llm"
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        abortOnError = false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    sourceSets {
        main {
            if (includeGenaiAgentFlag == 'true') {
                java.srcDirs += 'src/genaiAgentEnabled/java'
                kotlin.srcDirs += 'src/genaiAgentEnabled/kotlin'
            } else {
                java.srcDirs += 'src/genaiAgentDisabled/java'
            }
        }
    }
}

repositories {
    google()
    mavenCentral()
}


dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.10.0'
    implementation 'com.google.mediapipe:tasks-genai:0.10.24'
    implementation 'com.google.mlkit:genai-prompt:1.0.0-beta2'

    if (genaiAgentDependencyTypeFlag == 'compileOnly') {
        compileOnly 'com.google.mlkit:genai-agent:1.0.0-alpha1'
    } else if (includeGenaiAgentFlag == 'true') {
        implementation 'com.google.mlkit:genai-agent:1.0.0-alpha1'
        implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    }

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}
